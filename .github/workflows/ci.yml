name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · test · lint · schemas
    runs-on: ubuntu-latest
    # The UCI core's Postgres causal store is tested against a real PostgreSQL 17 (locally the
    # tests start an embedded one instead).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: uci
          POSTGRES_PASSWORD: uci
          POSTGRES_DB: uci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U uci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      UCI_PG_URL: postgres://uci:uci@localhost:5432/uci
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate protocol types
        run: pnpm run codegen

      - name: Validate JSON Schemas against fixtures
        run: pnpm run validate:schemas

      - name: Architecture check
        run: pnpm run arch:check

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check
