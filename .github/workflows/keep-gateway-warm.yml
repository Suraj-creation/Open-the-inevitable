name: keep-gateway-warm

# Render's free tier spins the gateway down after ~15 min idle; the first request after that pays a
# cold-start (~30–60s). This pings the health endpoint on a schedule so the instance stays warm.
# GitHub's scheduled cron is best-effort and can lag under load — for a hard guarantee use an external
# uptime pinger (UptimeRobot / cron-job.org, free) at a 5-min interval. The web client's wakingFetch
# retry already makes any residual cold-start non-fatal, so this is a UX improvement, not a dependency.

on:
  schedule:
    - cron: "*/10 * * * *" # every 10 minutes
  workflow_dispatch: {} # allow manual runs

# Only one warm-up in flight at a time; a late run never queues behind an earlier one.
concurrency:
  group: keep-gateway-warm
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping gateway health (wakes a cold instance)
        run: |
          curl -fsS -m 90 https://inevitable-gateway.onrender.com/api/sources/commons > /dev/null \
            && echo "gateway warm" \
            || echo "gateway did not respond in time (cold-start in progress or down)"
